<!DOCTYPE html>
<html>
<head>
  <title>Proxy Settings</title>
  <style>
    body {
      font-family: sans-serif;
      width: 300px;
    }
    #fixed-server-settings {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>Proxy Settings</h3>
  <div id="proxy-form">
    <div>
      <input type="radio" id="direct" name="mode" value="direct" checked>
      <label for="direct">Direct</label>
    </div>
    <div>
      <input type="radio" id="system" name="mode" value="system">
      <label for="system">System</label>
    </div>
    <div>
      <input type="radio" id="fixed" name="mode" value="fixed">
      <label for="fixed">Fixed Server</label>
    </div>
    <div id="fixed-server-settings" style="display: none; padding-left: 20px;">
      <div>
        <label for="server">Server:</label>
        <input type="text" id="server" placeholder="e.g., 127.0.0.1">
      </div>
      <div>
        <label for="port">Port:</label>
        <input type="number" id="port" placeholder="e.g., 8080">
      </div>
    </div>
    <br>
    <button id="save-button">Apply changes</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
